<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Core AI Developer</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      height: 100vh;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      color: #fff;
    }

    .container {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 20px;
      padding: 60px 80px;
      backdrop-filter: blur(15px);
      text-align: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      animation: fadeIn 2s ease forwards;
      width: 70%;
      max-width: 900px;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 20px;
      background: linear-gradient(90deg, #ff6ec4, #7873f5);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    #displayText {
      font-size: 1.2rem;
      margin: 25px 0;
      min-height: 140px;
      line-height: 1.6;
    }

    button {
      padding: 15px 40px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      background: linear-gradient(90deg, #ff6ec4, #7873f5);
      color: #fff;
      transition: 0.3s all;
      margin: 10px;
    }

    button:hover {
      transform: scale(1.1);
      box-shadow: 0 0 20px rgba(255, 110, 196, 0.5);
    }

    .shape {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      animation: float 6s ease-in-out infinite;
      filter: blur(50px);
    }

    .shape1 { width: 300px; height: 300px; top: -100px; left: -100px; }
    .shape2 { width: 200px; height: 200px; bottom: -50px; right: -50px; }
    .shape3 { width: 150px; height: 150px; top: 50%; left: 80%; }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-30px) rotate(45deg); }
    }
  </style>
</head>
<body>

  <div class="shape shape1"></div>
  <div class="shape shape2"></div>
  <div class="shape shape3"></div>

  <div class="container">
    <h1>Welcome to Core AI Developer</h1>

    <!-- TEXT APPEARS HERE -->
    <div id="displayText">Press English or Urdu button to hear and read the message.</div>

    <!-- Buttons -->
    <button onclick="speakEnglish()">ENGLISH 🔊</button>
    <button onclick="speakUrdu()">URDU 🔊</button>
  </div>

  <script>
    function speakEnglish() {
      const text = "Welcome to my website. First you pass the scholarship test. Take a screenshot of your test result. Then go to the IP giver and get your IP. Copy the IP code and paste it on the course fee. Take a picture of the fee and then press contact and send it to WhatsApp.";

      // Show text on screen
      document.getElementById("displayText").innerText = text;

      // Speak text
      const speech = new SpeechSynthesisUtterance(text);
      speech.lang = "en-US";
      speech.rate = 1;
      window.speechSynthesis.speak(speech);
    }

    function speakUrdu() {
      const text = "Welcome to my website. Pehle aap scholarship test pass karein. Test result ka screenshot lein. Phir IP giver par jaa kar apna IP hasil karein. Iss IP code ko copy karein aur course fee mein paste karein. Fee ki picture lein aur contact par jaa kar WhatsApp par send karein.";

      // Show Roman Urdu text on screen
      document.getElementById("displayText").innerText = text;

      // Speak text
      const speech = new SpeechSynthesisUtterance(text);
      speech.lang = "ur-PK"; // Urdu voice works for Roman Urdu
      speech.rate = 1;
      window.speechSynthesis.speak(speech);
    }
  </script>

</body>
</html>
